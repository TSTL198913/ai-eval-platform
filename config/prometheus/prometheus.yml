global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: 'ai-eval-platform'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
    scrape_interval: 10s

  - job_name: 'ai-eval-platform-fastapi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'celery-workers'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5555']
    scrape_interval: 30s
